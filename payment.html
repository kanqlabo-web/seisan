<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支払いを追加</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <a id="backLink" class="back-link">← イベントに戻る</a>
      <h1 id="pageTitle">支払いを追加</h1>
      <p class="required-legend"><span class="required-mark">*</span> は必須項目です</p>
    </header>
    <section class="card">
      <h2>入力モード</h2>
      <div class="mode-switch">
        <button id="splitModeButton" type="button" class="mode-button active">割り勘モード</button>
        <button id="exactModeButton" type="button" class="mode-button">個別金額モード</button>
      </div>
      <p id="modeHint" class="hint">参加者全員で金額を割り勘します（ステータス割引が適用されます）</p>
    </section>
    <section class="card">
      <h2>支払い情報</h2>
      <div class="receipt-scan-row">
        <input type="file" id="receiptInput" accept="image/*" capture="environment" hidden>
        <button type="button" id="scanReceiptButton" class="secondary-button">レシートを読み取る</button>
        <p id="receiptScanStatus" class="hint" hidden></p>
      </div>
      <label>支払った人 <span class="required-mark">*</span><select id="payer"></select></label>
      <label>内容<input id="description" type="text" placeholder="例：BBQ"></label>
      <div id="amountFieldGroup">
        <label>金額 <span class="required-mark">*</span><input id="amount" type="number" placeholder="金額" min="1"></label>
      </div>
    </section>
    <section id="statusCard" class="card">
      <h2>この支払いで使用するステータス</h2>
      <div id="paymentStatusOptions" class="checkbox-group"></div>
    </section>
    <section class="card">
      <h2>支払い対象者 <span class="required-mark">*</span></h2>
      <p id="exactModeDescription" class="section-description" hidden>同じ店で別々のものを頼んだ場合など、各自の金額をそのまま入力できます。</p>
      <div id="paymentMembers"></div>
      <p id="exactTotalDisplay" class="hint" hidden></p>
    </section>
    <section class="add-payment-section">
      <button id="savePaymentButton" class="primary-button">支払いを追加</button>
    </section>
  </main>
  <script type="module" src="payment.js"></script>
</body>
</html>
